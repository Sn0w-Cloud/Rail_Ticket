<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>기차표 결제</title>

    <link rel="stylesheet" th:href="@{/css/Train.css}" type="text/css"/>

    <script src="https://nsp.pay.naver.com/sdk/js/naverpay.min.js"></script>
</head>
<body>

<div class="checkout-page">

    <div class="checkout-container" th:if="${cart != null}">

        <div class="ticket-info">

            <div class="ticket-header">
                KTX
                <span th:text="${#numbers.formatInteger(cart.seat.train.trainNo, 3)}"></span>
                (
                <span th:text="${cart.seat.train.depPlaceName}"></span>
                →
                <span th:text="${cart.seat.train.arrPlaceName}"></span>
                )
            </div>

            <div class="ticket-body">

                <div class="journey-box">

                    <div class="station">
                        <span class="city"
                              th:text="${cart.seat.train.depPlaceName}"></span>

                        <span class="time"
                              th:text="${cart.seat.train.depPlanDtime}"></span>
                    </div>

                    <div class="arrow"></div>

                    <div class="station">
                        <span class="city"
                              th:text="${cart.seat.train.arrPlaceName}"></span>

                        <span class="time"
                              th:text="${cart.seat.train.arrPlanDtime}"></span>
                    </div>

                </div>

                <div class="train-detail-list">

                    <div class="train-detail-item">
                        <span>승차일자</span>
                        <span th:text="${cart.seat.train.date}"></span>
                    </div>

                    <div class="train-detail-item">
                        <span>열차 번호</span>
                        <span th:text="'KTX ' + ${#numbers.formatInteger(cart.seat.train.trainNo, 3)}"></span>
                    </div>

                    <div class="train-detail-item">
                        <span>좌석</span>
                        <span th:text="${cart.seat.seatNumber}"></span>
                    </div>

                </div>

            </div>

        </div>

        <div class="payment-wrapper">

            <h2>결제 수단</h2>

            <form id="paymentForm">

                <div class="payment-list">

                    <div class="payment-item">

                        <input type="radio"
                               name="paymentMethod"
                               id="naverpay"
                               value="naverpay"
                               checked>

                        <label for="naverpay" class="payment-label">

                            <div class="method-icon naver">N</div>

                            네이버페이

                        </label>

                    </div>

                    <div class="payment-item">

                        <input type="radio"
                               name="paymentMethod"
                               id="kakaopay"
                               value="kakaopay">

                        <label for="kakaopay" class="payment-label">

                            <div class="method-icon kakao">K</div>

                            카카오페이

                        </label>

                    </div>

                </div>


                <div class="total-price-box">

                    <div class="price-row">

                        <span>결제 금액</span>

                        <span class="price"
                              th:text="${#numbers.formatInteger(cart.totalPrice, 3, 'COMMA')} + '원'">
                        </span>

                    </div>

                </div>

                <button type="submit" class="pay-button">
                    결제하기
                </button>

            </form>

        </div>

    </div>

</div>


<script th:inline="javascript">

    const cartId = [[${cart.cartId}]];

    const productName =
        [[${cart.seat.train.depPlaceName}]] + " → " +
        [[${cart.seat.train.arrPlaceName}]];

    var oPay = Naver.Pay.create({

        mode: "development",

        clientId: [[${clientId}]],

        chainId: [[${chainId}]]

    });


    document.getElementById("paymentForm")
        .addEventListener("submit", async function(e){

            e.preventDefault();

            const selectedMethod =
                document.querySelector('input[name="paymentMethod"]:checked').value;

            if (selectedMethod === "kakaopay") {

                alert("현재 네이버페이만 지원합니다.");

                return;
            }

            const response = await fetch("/pay/naver/ready", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    cartId: cartId
                })

            });

            const orderData = await response.json();

            oPay.open({

                merchantPayKey: orderData.merchantPayKey,

                productName: productName,

                productCount: "1",

                totalPayAmount: orderData.amount,

                taxScopeAmount: orderData.amount,

                taxExScopeAmount: "0",

                returnUrl:
                    "http://localhost:8080/pay/naver/return?merchantPayKey="
                    + orderData.merchantPayKey

            });

        });

</script>

</body>
</html>
