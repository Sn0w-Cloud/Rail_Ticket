<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>비밀번호 변경</title>

    <link rel="stylesheet" th:href="@{/css/Train.css}" type="text/css"/>

</head>
<body>
<section>
    <div class="pw_section">
        <div class="pw_change">
            <form action="/member/Change_Pw" method="post">
                <input type="hidden" name="userId" th:value="${userId}"/>
                <input type="password" id="newPW" name="newPW" placeholder="신규 비밀번호 입력"/><br/>
                <input type="password" id="ch_newPW" name="ch_newPW" placeholder="신규 비밀번호 확인"/><br/>
                <div class="checkbox">
                    <label id="pwMatchLabel">V 비밀번호 일치 확인</label>
                </div>
                <button type="submit">비밀번호 변경</button>
            </form>
            <div class="modal-overlay" id="resultModal" th:if="${message}">
                <div class="modal-box">
                    <div class="modal-icon">&#10003;</div>
                    <div class="modal-message" th:text="${message}"
                         th:classappend="${messageType == 'success'} ? 'success' : 'error'"></div>
                    <button class="modal-button" id="modalOkBtn">OK</button>
                </div>
            </div>
        </div>
    </div>
</section>
<script th:if="${message}">
    const modal = document.getElementById('resultModal');
    modal.style.display = 'flex';

    document.getElementById('modalOkBtn').addEventListener('click', () => {
        window.location.href = '/member/login';
    });
</script>
<script>
    const newPW = document.getElementById('newPW');
    const ch_newPW = document.getElementById('ch_newPW');
    const pwMatchLabel = document.getElementById('pwMatchLabel');
    const form = document.querySelector('form');

    function checkPasswordMatch() {

        if (newPW.value === '' && ch_newPW.value === '') {
            pwMatchLabel.classList.remove('match');
            pwMatchLabel.classList.remove('error');
            return;

        }

        if (newPW.value === ch_newPW.value) {
            pwMatchLabel.classList.add('match');
            pwMatchLabel.classList.remove('error');

        } else {
            pwMatchLabel.classList.add('error');
            pwMatchLabel.classList.remove('match');

        }
    }

    newPW.addEventListener('input', checkPasswordMatch);
    ch_newPW.addEventListener('input', checkPasswordMatch);

    form.addEventListener('submit', function(event) {

        if (newPW.value === '' || ch_newPW.value === '') {
            alert('비밀번호를 모두 입력해주세요.');
            event.preventDefault();
            return;
        }

        if (newPW.value !== ch_newPW.value) {
            alert('비밀번호가 일치하지 않습니다.');
            ch_newPW.focus();
            event.preventDefault();
            return;
        }
    });
</script>
</body>
</html>
