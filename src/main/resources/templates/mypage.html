<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>마이페이지</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/mypage.css}">
</head>
<body>
<div th:replace="fragments/layout :: header"></div>
<div class="container">
    <div class="sidebar">
        <h2>마이페이지</h2>
        <ul>
            <li class="active" onclick="showSection('profile', this)">회원 정보 수정</li>
            <li onclick="showSection('orders', this)">구매 목록</li>
            <li onclick="showSection('withdraw', this)">회원 탈퇴</li>
        </ul>
    </div>

    <div class="content">
        <div class="section active" id="profile">
            <h3>회원 정보 수정</h3>

            <form th:action="@{/mypage/update}" method="post">

                <div class="form-group">
                    <label>이메일</label>
                    <input type="email" name="userEmail"
                           th:value="${loginUser.userEmail}"/>
                </div>

                <div class="form-group">
                    <label>전화번호</label>
                    <input type="tel" name="phoneNumber"
                           th:value="${loginUser.phoneNumber}"/>
                </div>

                <div class="form-group">
                    <label>주소</label>
                    <input type="text" name="userAddress"
                           th:value="${loginUser.userAddress}"/>
                </div>

                <!-- 🔥 버튼을 같은 부모로 -->
                <div class="button-group">
                    <button type="submit" class="btn btn-primary">
                        정보 저장
                    </button>

                    <a th:href="@{/member/Change_Pw}">
                        <button type="button" class="btn btn-primary">
                            비밀번호 변경
                        </button>
                    </a>
                </div>
            </form>
        </div>

        <div class="section" id="orders">
            <h3>구매 목록</h3>
            <table>
                <thead>
                <tr>
                    <th>주문번호</th>
                    <th>상품명</th>
                    <th>구매일</th>
                    <th>상태</th>
                    <th>관리</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="purchase : ${purchases}">
                    <td th:text="${purchase.merchantPayKey}"></td>
                    <td th:text="${purchase.listName}"></td>
                    <td th:text="${#temporals.format(purchase.purchaseDate, 'yyyy-MM-dd')}"></td>
                    <td>
                        <span th:if="${purchase.status.name() == 'CANCELED'}" style="color: red;">취소완료</span>
                        <div th:if="${purchase.status.name() == 'AVAILABLE'}">
                            <span th:if="${#temporals.createToday().isBefore(purchase.trainInfo.date)}">취소가능</span>
                        </div>
                        <span th:if="${purchase.status.name() == 'COMPLETED'}">구매확정</span>
                    </td>
                    <td>
                        <button th:if="${purchase.status.name() == 'AVAILABLE' and #temporals.createToday().isBefore(purchase.trainInfo.date)}"
                                th:onclick="|location.href='/purchase/cancel?id=${purchase.listId}'|"
                                class="btn-cancel">
                            구매취소
                        </button>
                        <span th:if="${#temporals.createToday().isEqual(purchase.trainInfo.date)}"
                              style="color: gray;">취소불가(당일)</span>
                        <span th:if="${#temporals.createToday().isAfter(purchase.trainInfo.date)}"
                              style="color: lightgray;">취소불가(기간만료)</span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(purchases)}">
                    <td colspan="5" style="text-align: center;">구매 내역이 없습니다.</td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="section" id="withdraw">
            <h3>회원 탈퇴</h3>
            <p>탈퇴 시 모든 정보는 복구할 수 없습니다.</p>
            <button class="btn btn-danger" onclick="withdraw()">회원 탈퇴</button>
        </div>
    </div>
</div>
<div th:replace="fragments/layout :: footer"></div>
<script>
    function showSection(id, element) {
        document.querySelectorAll('.section').forEach(section => {
            section.classList.remove('active');
        });
        document.getElementById(id).classList.add('active');

        document.querySelectorAll('.sidebar li').forEach(li => {
            li.classList.remove('active');
        });
        if (element) {
            element.classList.add('active');
        } else {
            // 사이드바 메뉴 중 해당 id를 가진 li를 찾아 active 추가
            const menuMap = {'profile': 0, 'orders': 1, 'withdraw': 2};
            document.querySelectorAll('.sidebar li')[menuMap[id]].classList.add('active');
        }
    }

    // 페이지 로딩 시 실행
    window.onload = function () {
        const hash = window.location.hash.substring(1); // #orders 에서 'orders'만 추출
        if (hash === 'orders') {
            showSection('orders');
        } else if (hash === 'withdraw') {
            showSection('withdraw');
        } else {
            showSection('profile');
        }
    }

    function withdraw() {
        if (confirm("정말 탈퇴하시겠습니까?")) {
            // 탈퇴 요청 보내기
            fetch('/mypage/withdraw', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: 'confirm=true'
            })
                .then(response => {
                    if (response.ok) {
                        alert("탈퇴가 완료되었습니다.");
                        window.location.href = "/member/logout"; // 로그아웃 처리
                    } else {
                        alert("탈퇴 처리 중 오류가 발생했습니다.");
                    }
                });
        }
    }
</script>
</body>
</html>
