<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>KTX 좌석 선택</title>

    <link rel="stylesheet" th:href="@{/css/Train.css}" type="text/css"/>
</head>

<body>

<div class="seat-select-page">

    <h1>KTX 좌석 선택</h1>

    <select id="carSelect">
        <option value="car1">1호차</option>
        <option value="car2">2호차</option>
    </select>


    <!-- 호차 반복 -->
    <div class="car"
         th:each="carNum : ${cars}"
         th:id="'car' + ${carNum}"
         th:classappend="${carNum == 1} ? ' active' : ''">

        <!-- 창문 -->
        <div class="windows">
            <div class="window"></div>
            <div class="window"></div>
            <div class="window"></div>
        </div>


        <!-- 상단 좌석 -->
        <div class="seat-row">

            <div th:each="seat : ${seatMap['car' + carNum + '_upper']}">

                <div class="seat"

                     th:text="${seat['seatNumber']}"

                     th:attr="data-seat-id=${seat['seatId']}"

                     th:classappend="
                        ${seat['status']=='RESERVED'} ? ' reserved' :
                        (${seat['status']=='BOOKED'} ? ' booked' : '')
                     ">

                </div>

            </div>

        </div>


        <!-- 방향 -->
        <div class="direction">

            <span th:text="${departure}"></span>

            <span class="arrows">▶ ▶ ▶ ▶ ▶</span>

            <span th:text="${arrival}"></span>

        </div>


        <!-- 하단 좌석 -->
        <div class="seat-row">

            <div th:each="seat : ${seatMap['car' + carNum + '_lower']}">

                <div class="seat"

                     th:text="${seat['seatNumber']}"

                     th:attr="data-seat-id=${seat['seatId']}"

                     th:classappend="
                        ${seat['status']=='RESERVED'} ? ' reserved' :
                        (${seat['status']=='BOOKED'} ? ' booked' : '')
                     ">

                </div>

            </div>

        </div>


        <!-- 창문 -->
        <div class="windows">
            <div class="window"></div>
            <div class="window"></div>
            <div class="window"></div>
        </div>

    </div>


    <!-- 버튼 -->
    <div class="action-buttons">

        <button type="button"
                class="cart-btn"
                onclick="addToCart()">
            장바구니
        </button>

        <button type="button"
                class="buy-btn"
                id="buyBtn">
            예매하기
        </button>

    </div>

</div>


<script th:inline="javascript">

    const isLoggedIn = [[${loginUser != null}]];

</script>


<script>

    /* 선택 좌석 */
    let selectedSeatIds = [];


    /* 좌석 클릭 */
    document.addEventListener("click", function(e){

        if(!e.target.classList.contains("seat")) return;

        const seat = e.target;

        if(seat.classList.contains("reserved")
            || seat.classList.contains("booked")) return;

        const seatId = seat.dataset.seatId;

        if(selectedSeatIds[0] === seatId){

            selectedSeatIds = [];

            seat.classList.remove("selected");

            return;

        }

        document.querySelectorAll(".seat.selected")
            .forEach(s=>s.classList.remove("selected"));

        selectedSeatIds=[seatId];

        seat.classList.add("selected");

    });


    /* 장바구니 */
    function addToCart(){

        if(!isLoggedIn){

            location.href="/member/login";

            return;

        }

        if(selectedSeatIds.length===0){

            alert("좌석을 선택하세요");

            return;

        }

        fetch("/ticket/cart",{

            method:"POST",

            headers:{"Content-Type":"application/json"},

            body:JSON.stringify({

                seatId:Number(selectedSeatIds[0])

            })

        })

            .then(res=>{

                if(!res.ok) throw new Error();

                alert("장바구니 담기 완료");

                location.href="/cart";

            })

            .catch(()=>alert("좌석 담기 실패"));

    }


    /* 구매 */
    document.getElementById("buyBtn")
        .addEventListener("click",function(){

            if(!isLoggedIn){

                location.href="/member/login";

                return;

            }

            if(selectedSeatIds.length===0){

                alert("좌석 선택하세요");

                return;

            }

            fetch("/ticket/direct-purchase",{

                method:"POST",

                headers:{"Content-Type":"application/json"},

                body:JSON.stringify({

                    seatId:Number(selectedSeatIds[0])

                })

            })

                .then(res=>{

                    if(!res.ok)

                        return res.text().then(t=>{throw new Error(t)});

                    return res.json();

                })

                .then(data=>{

                    location.href="/cart/payment/"+data.cartId;

                })

                .catch(err=>alert(err.message));

        });


    /* 호차 변경 */
    const carSelect=document.getElementById("carSelect");

    const cars=document.querySelectorAll(".car");

    carSelect.addEventListener("change",()=>{

        cars.forEach(c=>c.classList.remove("active"));

        document.getElementById(carSelect.value)
            .classList.add("active");

        selectedSeatIds=[];

        document.querySelectorAll(".seat")
            .forEach(s=>s.classList.remove("selected"));

    });

</script>

</body>
</html>
