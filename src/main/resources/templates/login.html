<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인 - RailTicket</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<div class="container">
    <h2>로그인</h2>

    <!-- 회원가입 성공 메시지 -->
    <div th:if="${message}" class="success" th:text="${message}" style="color:green; font-size:14px; margin-bottom:10px;"></div>

    <!-- 로그인 실패 메시지 -->
    <div th:if="${error}" class="error" th:text="${error}" style="color:red; font-size:14px; margin-bottom:10px;"></div>


    <form th:action="@{/member/login}" method="post">
        <label for="userId">아이디</label>
        <input type="text" id="userId" name="userId" placeholder="아이디 입력" required>

        <label for="password">비밀번호</label>
        <input type="password" id="password" name="password" placeholder="비밀번호 입력" required>

        <button type="submit">로그인</button>
    </form>

    <div class="signup-link">
        아직 회원이 아니신가요? <a th:href="@{/member/signup}">회원가입</a>
    </div>
    <div class="links">
        <a th:href="@{/member/Find_account}">아이디 / 비밀번호 찾기</a>
    </div>
</div>
</body>
</html>
