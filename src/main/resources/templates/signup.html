<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입 - RailTicket</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<div class="auth-container">
    <h2>회원가입</h2>

    <!-- 회원가입 실패/성공 메시지 -->
    <div th:if="${error}" class="error" th:text="${error}"></div>
    <div th:if="${message}" class="success" th:text="${message}"></div>

    <form th:action="@{/member/signup}" method="post" onsubmit="return validateForm()">
        <label for="userId">아이디</label>
        <input type="text" id="userId" name="userId" placeholder="아이디 입력" required>
        <!-- 아이디 중복 확인 메시지 -->
        <div id="idMessage" class="error"></div>

        <label for="userPw">비밀번호</label>
        <input type="password" id="userPw" name="userPw" placeholder="비밀번호 입력" required>

        <label for="userPwConfirm">비밀번호 확인</label>
        <input type="password" id="userPwConfirm" name="userPwConfirm" placeholder="비밀번호 확인 입력" required>
        <!-- 비밀번호 중복 확인 메시지 -->
        <div id="pwMessage" class="error"></div>

        <label for="userName">이름</label>
        <input type="text" id="userName" name="userName" placeholder="이름 입력" required>

        <label for="userEmail">이메일</label>
        <input type="email" id="userEmail" name="userEmail" placeholder="이메일 입력" required>

        <label for="phoneNumber">전화번호</label>
        <input type="tel"
               id="phoneNumber"
               name="phoneNumber"
               placeholder="010-1234-5678"
               required>
        <div id="phoneMessage" class="error"></div>

        <label for="birthDate">생년월일</label>
        <input type="date" id="birthDate" name="birthDate" required>

        <label for="userAddress">주소</label>
        <input type="text" id="userAddress" name="userAddress" placeholder="주소 입력" required>

        <button type="submit">회원가입</button>
    </form>

    <div class="login-link">
        이미 계정이 있으신가요? <a th:href="@{/member/login}">로그인</a>
    </div>
</div>

<script>



    // js로 오늘 날짜 자동 설정
    document.addEventListener("DOMContentLoaded", function () {
    const birthInput = document.getElementById("birthDate");
    const today = new Date().toISOString().split("T")[0];
    birthInput.max = today;
    });

    // 비밀번호 확인 체크
    function validateForm() {
        const idMessage = document.getElementById("idMessage").textContent;

        if (idMessage === "이미 사용중인 아이디입니다.") {
            alert("다른 아이디를 사용해주세요.");
            return false;
        }

        return true;
    }

    // 아이디 입력 시 실시간 중복 체크 (AJAX)
    const userIdInput = document.getElementById("userId");
    const idMessageDiv = document.getElementById("idMessage");

    userIdInput.addEventListener("keyup", function() {
        const userId = userIdInput.value.trim();
        if (userId.length < 3) {
            idMessageDiv.textContent = "아이디는 3자 이상이어야 합니다.";
            idMessageDiv.className = "error";
            return;
        }

        fetch(`/member/check-id?userId=${encodeURIComponent(userId)}`)
            .then(response => response.text())   // ⭐ text로 받기
            .then(data => {
                if (data === "EXIST") {
                    idMessageDiv.textContent = "이미 사용중인 아이디입니다.";
                    idMessageDiv.className = "error";
                } else if (data === "AVAILABLE") {
                    idMessageDiv.textContent = "사용 가능한 아이디입니다.";
                    idMessageDiv.className = "success";
                }
            })
            .catch(err => {
                console.error(err);
                idMessageDiv.textContent = "아이디 확인 중 오류가 발생했습니다.";
                idMessageDiv.className = "error";
            });

    // ✅ 비밀번호 확인 실시간 체크
    const pwInput = document.getElementById("userPw");
    const pwConfirmInput = document.getElementById("userPwConfirm");
    const pwMessageDiv = document.getElementById("pwMessage");

    function checkPasswordMatch() {
        const pw = pwInput.value;
        const pwConfirm = pwConfirmInput.value;

        if (pwConfirm.length === 0) {
            pwMessageDiv.textContent = "";
            return;
        }

        if (pw === pwConfirm) {
            pwMessageDiv.textContent = "비밀번호 확인 완료!";
            pwMessageDiv.className = "success";
        } else {
            pwMessageDiv.textContent = "비밀번호가 틀립니다";
            pwMessageDiv.className = "error";
        }
    }

    pwInput.addEventListener("input", checkPasswordMatch);
    pwConfirmInput.addEventListener("input", checkPasswordMatch);
    });
</script>
</body>
</html>
