<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>구매 완료 - 기차 예매 시스템</title>

    <link rel="stylesheet" th:href="@{/css/Train.css}" type="text/css"/>
</head>
<body class="purchase-success-page">

<div class="purchase-success-container">

    <div class="purchase-success-icon">
        ✔
    </div>

    <h1 class="purchase-success-title">
        결제 완료!
    </h1>

    <p class="purchase-success-message">
        기차 티켓 예매가 정상적으로 처리되었습니다.<br>
        즐거운 여행 되세요!
    </p>

    <div class="purchase-success-info">

        <div class="purchase-success-info-title">
            💡 안내사항
        </div>

        <div class="purchase-success-info-content">
            - 예매 내역은 '마이페이지' → '구매 목록'에서 확인 가능합니다.<br>
            - 출발 10분 전까지 역에 도착해 주세요.
        </div>

    </div>

    <div class="purchase-success-btn-group">

        <button
                class="purchase-success-btn purchase-success-btn-main"
                onclick="location.href='/member/'">
            홈으로 돌아가기
        </button>

        <button
                class="purchase-success-btn purchase-success-btn-list"
                onclick="location.href='/mypage#orders'">
            내 구매 목록 보기
        </button>

    </div>

</div>

</body>
</html>
