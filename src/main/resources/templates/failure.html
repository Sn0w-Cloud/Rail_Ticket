<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>결제 실패 - 기차 예매 시스템</title>

    <link rel="stylesheet" th:href="@{/css/Train.css}" type="text/css"/>

</head>
<body>

<section class="payment_error_section">

    <div class="payment_error_container">

        <div class="payment_error_icon">!</div>

        <h1 class="payment_error_title">
            결제에 실패했습니다
        </h1>

        <p class="payment_error_description">
            요청 처리 중 문제가 발생하여<br>
            예매가 완료되지 않았습니다.
        </p>

        <div class="payment_error_reason">

            <div class="payment_error_reason_title">
                🧐 확인해 보세요
            </div>

            <div class="payment_error_reason_content">
                - 결제 창을 중간에 닫으셨나요?<br>
                - 좌석 선택 후 결제 제한 시간(10분)이 지났나요?<br>
                - 카드 잔액 부족 혹은 한도 초과인가요?
            </div>

        </div>

        <div class="payment_error_button_group">

            <button
                    class="payment_error_retry_button"
                    onclick="history.back()">
                다시 시도하기
            </button>

            <button
                    class="payment_error_home_button"
                    onclick="location.href='/member/'">
                메인 페이지로 이동
            </button>

        </div>

    </div>

</section>

</body>
</html>
