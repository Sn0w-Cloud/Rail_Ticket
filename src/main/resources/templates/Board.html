<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시판</title>

    <link rel="stylesheet" th:href="@{/css/Train.css}" type="text/css"/>
    <link rel="stylesheet" th:href="@{/css/common.css}">
</head>

<body>
<div th:replace="fragments/layout :: header"></div>

<section>
    <div class="board_container">
        <div class="board_wrap">

            <div class="board_title">게시판</div>

            <div class="board_menu">
                <div class="board_menu_item">
                    <button class="board_menu_button"
                            onclick="location.href='/board?type=NOTICE'">
                        공지사항
                    </button>
                </div>

                <div class="board_menu_item">
                    <button class="board_menu_button"
                            onclick="location.href='/board?type=QNA'">
                        건의 게시판
                    </button>
                </div>

                <div class="board_menu_item">
                    <button class="board_menu_button"
                            onclick="location.href='/board?type=EVENT'">
                        이벤트
                    </button>
                </div>

                <div class="board_search">
                    <form class="board_search_form"
                          method="get"
                          action="/board">
                        <input
                                type="text"
                                name="keyword"
                                class="board_search_input"
                                placeholder="제목 검색">
                        <button type="submit"
                                class="board_search_button">
                            &#128269;
                        </button>
                    </form>
                </div>
            </div>

            <div class="board_dividr">
                <hr class="divider">
            </div>

            <!-- ===== 게시글 목록 ===== -->
            <div class="board_list_item"
                 th:each="board : ${boardList}">
                <div class="board_item_type"
                     th:text="${board.boardType}">
                    게시판타입
                </div>

                <a class="board_item_link"
                   th:href="@{/board/read/{id}(id=${board.boardId})}">
                    <div class="board_item_title"
                         th:text="${board.title}">
                        제목
                    </div>
                </a>

                <div class="board_item_date"
                     th:text="${#temporals.format(board.createdAt,'yyyy-MM-dd')}">
                    작성일
                </div>
            </div>
            <!-- ===== 글쓰기 버튼 ===== -->
            <div style="text-align: right; margin-top: 20px;">
                <button class="board_detail_button"
                        onclick="location.href='/board/write'">
                    글쓰기 ✏️
                </button>
            </div>
        </div>
    </div>
</section>

<div th:replace="fragments/layout :: footer"></div>
</body>
</html>
