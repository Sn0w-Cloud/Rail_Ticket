<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>계정 찾기</title>

    <link rel="stylesheet" th:href="@{/css/Train.css}" type="text/css"/>

    <script>
        function search_id_on() {

            document.querySelector('.find_account_id_search')
                .style.display = 'block';

            document.querySelector('.find_account_pw_search')
                .style.display = 'none';
        }

        function search_pw_on() {

            const msg = document.querySelector('.find_account_result_success');

            document.querySelector('.find_account_pw_search')
                .style.display = 'block';

            document.querySelector('.find_account_id_search')
                .style.display = 'none';

            if(msg){
                msg.innerHTML = '';
                msg.style.display = 'none';
            }
        }
    </script>

</head>
<body>

<header></header>

<section class="find_account_section">

    <div class="find_account_container">

        <!-- 상단 버튼 -->
        <div class="find_account_tab">

            <button
                    type="button"
                    class="find_account_tab_button"
                    onclick="search_id_on()">

                아이디 찾기

            </button>

            <button
                    type="button"
                    class="find_account_tab_button"
                    onclick="search_pw_on()">

                비밀번호 찾기

            </button>

        </div>


        <!-- 아이디 찾기 -->
        <div class="find_account_id_search">

            <form
                    action="/member/SearchID"
                    method="post"
                    class="find_account_form">

                <input
                        type="text"
                        name="userName"
                        class="find_account_input"
                        placeholder="이름"
                        required>

                <input
                        type="text"
                        name="phoneNumber"
                        class="find_account_input"
                        placeholder="전화번호"
                        required>

                <button
                        type="submit"
                        class="find_account_submit_button">

                    아이디 찾기

                </button>

            </form>

        </div>


        <!-- 비밀번호 찾기 -->
        <div class="find_account_pw_search">

            <form
                    action="/member/SearchPW"
                    method="post"
                    class="find_account_form">

                <input
                        type="text"
                        name="userId"
                        class="find_account_input"
                        placeholder="아이디"
                        required>

                <input
                        type="text"
                        name="userName"
                        class="find_account_input"
                        placeholder="이름"
                        required>

                <button
                        type="submit"
                        class="find_account_submit_button">

                    비밀번호 찾기

                </button>

            </form>

        </div>


        <!-- 성공 메시지 -->
        <div
                class="find_account_result_success"
                th:if="${userId}">

            당신의 아이디는
            <strong th:text="${userId}"></strong>
            입니다.

        </div>


        <!-- 에러 메시지 -->
        <div
                class="find_account_result_error"
                th:if="${error}">

            <span th:text="${error}"></span>

        </div>

    </div>

</section>

</body>
</html>
